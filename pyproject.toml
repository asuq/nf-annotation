[project]
name = "nf-annotation"
version = "0.5.2"
requires-python = ">=3.12,<3.13"
dependencies = [
    "biopython==1.84",
    "numpy==2.1.1",
    "scipy==1.14.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
extend-exclude = ["external"]

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["bin", "tests"]

[tool.ty.src]
exclude = ["external"]
